<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile Card</title>
  <!-- Ícones FontAwesome para as redes sociais -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Configurações Globais e Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a; /* Azul escuro profundo */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container do Card com efeito de borda gradiente */
    .card-container {
      position: relative;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); /* Gradiente azul para roxo */
      padding: 2px; /* Espessura da borda */
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 100%;
      max-width: 350px;
    }

    .card-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.3);
    }

    /* Conteúdo Interno do Card */
    .card-content {
      background: #1e293b; /* Fundo do card */
      border-radius: 18px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Foto de Perfil */
    .profile-img-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
    }

    /* Indicador "Disponível para freelas/trabalho" */
    .status-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background-color: #10b981; /* Verde esmeralda */
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid #1e293b;
    }

    /* Textos */
    .name {
      color: #f8fafc;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .role {
      color: #3b82f6; /* Cor de destaque */
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .bio {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Badges de Tecnologias/Skills */
    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tag {
      background: #2d3748;
      color: #cbd5e1;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Links de Redes Sociais */
    .social-links {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .social-icon {
      color: #94a3b8;
      font-size: 1.3rem;
      transition: color 0.2s ease, transform 0.2s ease;
      text-decoration: none;
    }

    .social-icon:hover {
      color: #f8fafc;
      transform: scale(1.1);
    }

    /* Botão de Ação (Portfólio / Contato) */
    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .action-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card-content">
      
      <!-- Foto de Perfil com Status Ativo -->
      <div class="profile-img-container">
        <!-- Substitua a URL abaixo pela sua foto ou do dev -->
        <img src="img/foto-ruby1.jpg" alt="Foto do Desenvolvedor" class="profile-img">
        <span class="status-badge" title="Disponível para projetos"></span>
      </div>

      <!-- Informações Principais -->
      <h2 class="name">Wallisson</h2>
      <p class="role">Desenvolvendo com Rails</p>
      
      <p class="bio">
        Construindo aplicações robustas, escaláveis e focadas na melhor experiência de usuário. Apaixonado por arquitetura de software e código limpo.
      </p>

      <!-- Tecnologias/Tags -->
      <div class="tech-tags">
        <span class="tag">Ruby on Rails</span>
        <span class="tag">PostgreSQL</span>
        <span class="tag">Git</span>
        <span class="tag">Docker</span>
      </div>

      <!-- Redes Sociais -->
      <div class="social-links">
        <a href="#" target="_blank" class="social-icon" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank" class="social-icon" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="#" target="_blank" class="social-icon" title="Portfólio pessoal"><i class="fas fa-globe"></i></a>
        <a href="mailto:seuemail@exemplo.com" class="social-icon" title="Enviar E-mail"><i class="fas fa-envelope"></i></a>
      </div>

      <!-- Botão de Ação -->
      <button class="action-btn" onclick="window.open('#', '_blank')">Ver Portfólio</button>

    </div>
  </div>

</body>
</html>
